version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Test123
      POSTGRES_DB: spotify_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    volumes:
      - ./backend/app:/app/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_BUCKET=your-bucket
      - AWS_ACCESS_KEY_ID=your-access-key
      - AWS_SECRET_ACCESS_KEY=your-secret-key
      - MAIN_SERVICE_URL=http://backend:8000
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  gateway:
    build: ./backend
    command: python run_gateway.py
    volumes:
      - ./backend/app:/app/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIN_SERVICE_URL=http://backend:8000
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8001
    depends_on:
      - backend
      - redis
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  pgdata: 